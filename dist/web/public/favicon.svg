<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <!-- The app's mark: a 3x3 grid whose top row is offset by a quarter turn.
       This is the browser-TAB icon, which is re-read on every page load -- unlike the
       home-screen icon, which iOS copies once at install and never looks at again. -->
  <rect width="30" height="30" fill="#000000"/>
  <g fill="#ECEFF2">
    <rect x="5" y="0" width="8" height="8"/><rect x="15" y="0" width="8" height="8"/><rect x="25" y="0" width="5" height="8"/>
  </g>
  <g fill="#ECEFF2" opacity="0.42">
    <rect x="0" y="10" width="8" height="8"/><rect x="10" y="10" width="8" height="8"/><rect x="20" y="10" width="8" height="8"/>
    <rect x="0" y="20" width="8" height="8"/><rect x="10" y="20" width="8" height="8"/><rect x="20" y="20" width="8" height="8"/>
  </g>
</svg>
